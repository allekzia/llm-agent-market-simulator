name: Docker Build

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t market-sim .

      - name: Run the container
        run: docker run -d -p 7860:7860 --name market-sim-test market-sim

      - name: Wait for the app to start
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost:7860/_stcore/health; then
              echo "App is up."
              exit 0
            fi
            echo "Waiting for app to start... ($i/15)"
            sleep 2
          done
          echo "App did not become healthy in time."
          docker logs market-sim-test
          exit 1

      - name: Show logs (always, for debugging)
        if: always()
        run: docker logs market-sim-test

      - name: Stop the container
        if: always()
        run: docker stop market-sim-test
